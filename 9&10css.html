Q.10:
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        label {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="form">
        <h1 style="color: white; background-color: green; text-align: center;">Student Registration Form</h1>

        <h2>Enter Your Details</h2>

        <form>
            <label>Name:</label>
            <input type="text">
            <br><br>

            <label>Email:</label>
            <input type="email">
            <br><br>

            <label>Password:</label>
            <input type="password">
            <br><br>

            <label>Age:</label>
            <input type="number">
            <br><br>

            <label>Course:</label>
            <input type="text">
            <br><br>

            <button type="submit">Register</button>
        </form>

    </div>

</body>
</html>
