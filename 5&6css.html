Q.6:
<!DOCTYPE html>
<html>
<head>
    <title>Font Weight</title>

    <style>
        h1 {
            font-weight: bold;
        }

        p {
            font-weight: normal;
        }

        .p1 {
            font-weight: bold;
        }

        .p2 {
            font-weight: lighter;
        }
    </style>
</head>

<body>

    <h1>Hello guys!!</h1>

    <p class="p1">This is my first webpage.</p>

    <p class="p2">Career Guidance.</p>

</body>
</html>
